# Runs in the public claudepoint-agent mirror (this folder is its repo root); inert in
# the private CLAUDEPOINT repo, where workflows only load from the top-level .github/.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy claude_telegram_agent
