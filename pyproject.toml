[project]
name = "claude-telegram-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2.152",
  "websockets>=17.1",
  "httpx>=0.28.1",
  "platformdirs>=4.11.8",
]

[project.scripts]
claude-telegram-agent = "claude_telegram_agent.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["claude_telegram_agent/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
